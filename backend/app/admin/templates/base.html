<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Адмінка{% endblock %} · The Tender Telegram</title>
<link rel="stylesheet" href="/admin/static/admin.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar"><div class="inner">
  <div class="brand">The Tender <small>Telegram</small>
    <span class="env {{ 'prod' if environment == 'prod' else '' }}">{{ environment|upper }}</span></div>
  {% if admin %}
  <nav class="main">
    <a href="/admin" class="{{ 'active' if section == 'overview' }}">📊 Огляд</a>
    <a href="/admin/users" class="{{ 'active' if section == 'users' }}">👥 Користувачі</a>
    <a href="/admin/consultations" class="{{ 'active' if section == 'consultations' }}">💬 Консультації</a>
    <a href="/admin/campaigns" class="{{ 'active' if section == 'campaigns' }}">📣 Розсилки</a>
    <a href="/admin/settings" class="{{ 'active' if section == 'settings' }}">⚙️ Налаштування</a>
  </nav>
  <div class="who">
    <span>{{ admin.name or ('@' ~ admin.username) }}</span>
    <form class="inline" method="post" action="/admin/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit">Вийти</button>
    </form>
  </div>
  {% endif %}
</div></header>
<main>
  {% if flash %}<div class="flash {{ flash[0] }}">{{ flash[1] }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
